[package]
name = "lemur"
version = "2.0.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
# The fonts installed, for Settings' font menu: fontique lists their families (Rune's text has
# it already) and skrifa measures their letters, to offer the monospaced ones.
fontique = { version = "0.12", default-features = false, features = ["std", "system"] }
futures = "0.3"
# Ghostty's terminal core, libghostty-vt. Its build script fetches Ghostty at the commit the
# bindings pin and builds it with Zig 0.17 (mise.toml).
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "84373f8d48b8f0b794e259f74a71a52686616f5d", default-features = false }
# Asking for attention (the Dock icon's bounce) when a thread has news, which Rune can't on
# macOS. arboard builds both already.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
# Held keys repeating in the terminal (see `gui::held_keys_repeat`).
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary", "NSString", "NSUserDefaults", "NSValue"] }
png = "0.18.1"
# The window: Rune draws it, rune-kit has its controls. Rune is pre-release: a rev of `dev`.
rune = { git = "https://github.com/anomalyco/rune", rev = "24bd7bbb60db77a4149e64318a3df6fccbee54d1", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "24bd7bbb60db77a4149e64318a3df6fccbee54d1", features = ["markdown"] }
# The window's place kept across launches, and macOS's notifications.
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "24bd7bbb60db77a4149e64318a3df6fccbee54d1" }
# The Keychain, so only Lemur can read its Linear sign-in.
security-framework = { version = "3.7.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
skrifa = { version = "0.44", default-features = false, features = ["std"] }
toml = "1.1.8"
toml_edit = "0.25.17"
unicode-width = "0.2.2"

[profile.dev.package."*"]
debug = false
